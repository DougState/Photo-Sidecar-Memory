[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bridge-assist"
version = "0.1.0"
description = "Taste-driven RAW photo router"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "click>=8.0",
    "rawpy>=0.19.0",
    "Pillow>=10.0",
    "anthropic>=0.40.0",
    "openai>=1.0.0",
    "psd-tools>=1.9.0",
    "watchdog>=4.0.0",
]

[project.scripts]
bridge-assist = "bridge_assist.cli:main"

[tool.setuptools.packages.find]
include = ["bridge_assist*"]
